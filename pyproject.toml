[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flakehunter"
version = "0.1.0"
description = "Find, rank and triage flaky tests from the JUnit XML your CI already produces."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Eswar Varun S", email = "s.eswarvarun@gmail.com" }]
dependencies = ["defusedxml>=0.7"]

[project.optional-dependencies]
# The serverless backend: Lambda's runtime already ships boto3, so only local use needs it.
aws = ["boto3>=1.35"]
dev = ["pytest>=8", "ruff>=0.6", "boto3>=1.35", "moto[dynamodb]>=5"]
# The CDK app in infra/ (deploying also needs Node.js for `npx aws-cdk@2`).
infra = ["aws-cdk-lib>=2.170", "constructs>=10"]

[project.scripts]
flakehunter = "flakehunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501", "S105", "S311"]
"zoo/**" = ["S101", "S311"]
"bench/**" = ["S603"]
